name: test

# Third-party actions are pinned by commit digest, with the release they were
# at in the trailing comment. A tag like v5 is mutable: whoever controls the
# repo can repoint it at any commit, and that commit runs here with our
# secrets. The digest is the only immutable reference GitHub offers.
#
# To bump one, resolve the tag and take the sha it prints — don't hand-copy:
#   gh api repos/<owner>/<repo>/commits/<tag> --jq .sha

on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
